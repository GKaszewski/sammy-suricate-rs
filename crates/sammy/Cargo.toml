[package]
name = "sammy"
version = "0.1.0"
edition.workspace = true

[dependencies]
formats.workspace = true
sammy-core.workspace = true
bevy = { version = "0.20", features = ["wav"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rustysynth = "1.3"
anyhow.workspace = true

[dev-dependencies]
# System names in schedule dumps (tests only).
bevy = { version = "0.20", features = ["wav", "debug"] }
