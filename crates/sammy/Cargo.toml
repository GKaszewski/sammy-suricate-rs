[package]
name = "sammy"
version = "0.1.0"
edition.workspace = true

[dependencies]
formats.workspace = true
sammy-core.workspace = true
bevy = { version = "0.20", features = ["wav"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rustysynth = { version = "1.3", optional = true }
anyhow.workspace = true

[features]
default = ["music", "intro", "debug-tools"]
# MIDI music through a SoundFont (rustysynth).
music = ["dep:rustysynth"]
# The boot intro (logos and the scripted walk) before the menu.
intro = []
# Screenshot runs and the debug log.
debug-tools = []

[dev-dependencies]
# System names in schedule dumps (tests only).
bevy = { version = "0.20", features = ["wav", "debug"] }
