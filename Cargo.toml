[workspace]
resolver = "3"
members = ["crates/formats", "crates/sammy-convert", "crates/sammy-core", "crates/sammy-platform", "crates/sammy-present", "crates/sammy", "crates/sammy-sdl"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
formats = { path = "crates/formats" }
sammy-core = { path = "crates/sammy-core" }
sammy-platform = { path = "crates/sammy-platform" }
sammy-present = { path = "crates/sammy-present" }
anyhow = "1"

[profile.dev.package."*"]
opt-level = 3
